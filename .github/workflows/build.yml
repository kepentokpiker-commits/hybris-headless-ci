name: build-hybris
on: { workflow_dispatch: {}, push: { branches: [main] } }
jobs:
  build:
    runs-on: ubuntu-24.04-arm
    strategy:
      fail-fast: false
      matrix:
        include:
          - { android: 12, tag: android-12.0.0_r1 }
          - { android: 13, tag: android-13.0.0_r1 }
          - { android: 14, tag: android-14.0.0_r1 }
          - { android: 15, tag: android-15.0.0_r1 }
          - { android: 16, tag: android-16.0.0_r1 }
    steps:
      - uses: actions/checkout@v4
      - run: |
          sudo apt-get update
          sudo apt-get install -y clang autoconf automake libtool \
            pkg-config make git libegl-dev libgles-dev libglvnd-dev dpkg-dev
      - run: bash scripts/fetch-headers.sh "${{ matrix.tag }}" "$PWD/work/headers"
      - run: bash scripts/build-hybris.sh "${{ matrix.android }}"
      - run: dpkg-deb -c dist/*.deb | head -50
      - uses: actions/upload-artifact@v4
        with:
          name: hybris-headless-android${{ matrix.android }}-arm64
          path: dist/*.deb