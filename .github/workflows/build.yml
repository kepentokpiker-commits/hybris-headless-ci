name: build-hybris-chain

on:
  workflow_dispatch:
    inputs:
      android_version:
        description: Versi header Android
        type: choice
        options: ["10", "11", "12", "13", "14", "15", "16"]
        default: "12"
      ubuntu_version:
        description: Versi Ubuntu target
        type: choice
        options: ["24.04", "24.10", "25.04", "25.10", "26.04"]
        default: "24.04"
      api_egl_gles: {type: boolean, default: true, description: EGL/GLES/GL}
      api_gralloc:  {type: boolean, default: true, description: gralloc/hwcomposer}
      api_vulkan:   {type: boolean, default: true, description: Vulkan}
      api_opencl:   {type: boolean, default: true, description: OpenCL}
      api_media:    {type: boolean, default: true, description: VA-API/VDPAU/media}
      drv_hal_icd:     {type: boolean, default: true, description: ICD HAL via libhybris}
      drv_panvk_kbase: {type: boolean, default: true, description: PanVK kbase}
      drv_turnip_kgsl: {type: boolean, default: true, description: Turnip KGSL}
      ubuntu_packages:
        description: "all, atau daftar dipisah koma (libdrm,libglvnd,mesa,...)"
        default: "all"
        type: string

jobs:
  chain:
    runs-on: ubuntu-24.04-arm
    container:
      image: ubuntu:${{ inputs.ubuntu_version }}
    timeout-minutes: 360
    env:
      STAGE: ${{ github.workspace }}/stage
      ANDROID_VERSION: ${{ inputs.android_version }}
      UBUNTU_VERSION: ${{ inputs.ubuntu_version }}
      API_EGL_GLES: ${{ inputs.api_egl_gles }}
      API_GRALLOC: ${{ inputs.api_gralloc }}
      API_VULKAN: ${{ inputs.api_vulkan }}
      API_OPENCL: ${{ inputs.api_opencl }}
      API_MEDIA: ${{ inputs.api_media }}
      DRV_HAL_ICD: ${{ inputs.drv_hal_icd }}
      DRV_PANVK_KBASE: ${{ inputs.drv_panvk_kbase }}
      DRV_TURNIP_KGSL: ${{ inputs.drv_turnip_kgsl }}
      UBUNTU_PACKAGES: ${{ inputs.ubuntu_packages }}
      DEBIAN_FRONTEND: noninteractive
      CC: clang
      CXX: clang++
    steps:
      - name: 0. Dasar container
        run: |
          # 24.10 sudah EOL, sumber paket dipindah ke old-releases
          if [ "$UBUNTU_VERSION" = "24.10" ]; then
            sed -i -e 's|http://archive.ubuntu.com|http://old-releases.ubuntu.com|g' \
                   -e 's|http://security.ubuntu.com|http://old-releases.ubuntu.com|g' \
                   -e 's|http://ports.ubuntu.com|http://old-releases.ubuntu.com|g' \
                   /etc/apt/sources.list.d/ubuntu.sources
          fi
          apt-get update
          apt-get install -y ca-certificates git sudo

      - uses: actions/checkout@v4

      - name: 1. Siapkan dependensi
        run: |
          sed -i 's/^Types: deb$/Types: deb deb-src/' /etc/apt/sources.list.d/ubuntu.sources
          apt-get update
          apt-get install -y clang autoconf automake libtool pkg-config \
            devscripts dpkg-dev equivs meson ninja-build \
            libdrm-dev libx11-dev libwayland-dev mesa-utils vulkan-tools clinfo
          mkdir -p "$STAGE" logs

      - name: 2. Header Android
        run: ./scripts/01-headers.sh

      - name: 3. libhybris lengkap (semua API terpilih)
        run: ./scripts/02-libhybris.sh

      - name: 4. Tes lapisan libhybris
        run: ./scripts/03-test-hybris.sh

      - name: 5. Dasar bersama dma-buf
        run: ./scripts/04-dmabuf.sh

      - name: 6. Jembatan tipis (libglvnd, ICD Vulkan, ICD OpenCL, GBM, VA-API/VDPAU)
        run: ./scripts/05-bridges.sh

      - name: 7. Rebuild library Ubuntu terhadap hasil 3-6
        run: ./scripts/06-rebuild-ubuntu.sh

      - name: 8. Verifikasi akhir
        run: ./scripts/07-verify.sh

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: hybris-chain-android${{ inputs.android_version }}-ubuntu${{ inputs.ubuntu_version }}
          path: |
            stage/
            logs/
